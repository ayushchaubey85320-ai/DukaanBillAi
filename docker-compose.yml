version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dukaanai-backend
    ports:
      - "8001:8001"
    volumes:
      - ./backend/app/data:/app/backend/app/data
    restart: unless-stopped
    environment:
      - PORT=8001

  frontend:
    image: node:20-alpine
    container_name: dukaanai-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host --port 5173"
    depends_on:
      - backend
    restart: unless-stopped
