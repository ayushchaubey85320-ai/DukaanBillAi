services:
  - type: web
    name: dukaanbillai
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
